version: '3.9'

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    image: lms-api:build
    command: pnpm --filter @lms/shared db:migrate:prod
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lms-net
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: lms-api:prod
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - lms-net
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://yourdomain.com}
    image: lms-web:prod
    restart: unless-stopped
    env_file: .env
    networks:
      - lms-net
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD 2>/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - api
      - web
    networks:
      - lms-net

volumes:
  mysql-data:
  uploads:
  nginx-cache:

networks:
  lms-net:
    driver: bridge
