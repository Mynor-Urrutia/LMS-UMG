version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps
    image: lms-api-dev
    command: pnpm --filter @lms/api dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      - uploads:/app/uploads
    ports:
      - '3001:3001'
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lms-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    image: lms-web-dev
    command: pnpm --filter @lms/web dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    ports:
      - '3000:3000'
    env_file: .env
    networks:
      - lms-net

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-net

volumes:
  mysql-data:
  uploads:

networks:
  lms-net:
    driver: bridge
